# Example CI job (GitHub Actions). Any CI works: run the script, fail on exit 1.
name: modularity
on: [pull_request]
jobs:
  check-modularity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: .agents/tools/check-modularity.sh --base origin/${{ github.base_ref }}
